name: First Workflow
on: push
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with: 
          node-version: 18
      - name: Install dependencies
        run : npm ci 
      - name: Run test
        run : npm test
  deploy :
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with: 
          node-version: 18
      - name: Install dependencies
        run : npm ci
      - name: Run test
        run : npm test
      - name : Build project
        run : npm run build
      - name : deploy  
        run : echo "deploying"
